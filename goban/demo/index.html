<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>goban_ui demo</title>
<meta name="description" content="Phone-first Go board — BesoGo feel with BW-Go tether and delete-last.">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="goban">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../vendor/besogo/icon32.png" sizes="32x32">
<link rel="icon" type="image/png" href="../vendor/besogo/icon192.png" sizes="192x192">
<link rel="icon" href="../vendor/besogo/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../vendor/besogo/icon192.png">
<link rel="stylesheet" href="../vendor/besogo/css/besogo.css">
<link rel="stylesheet" href="../vendor/besogo/css/besogo-fill.css">
<link rel="stylesheet" href="../vendor/besogo/css/board-flat.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
  }

  #target {
    height: 100%;
    width: 100%;
  }

  #target.besogo-container {
    background: #1a1a1a;
    justify-content: space-between;
  }

  .goban-phone .besogo-board {
    flex: 0 0 auto;
  }

  .goban-phone .besogo-panels {
    flex: 0 0 auto;
  }

  /* Phone nav row: flat glyphs on the bar — no bevelled frames or captions (#22). */
  .goban-phone .besogo-control {
    flex-wrap: nowrap;
    justify-content: space-between;
    gap: 4px;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    background: #eceae4;
    border-top: 1px solid #c8c4bc;
  }

  .goban-phone .besogo-control button {
    min-width: 44px;
    min-height: 44px;
    height: 52px;
    width: auto;
    padding: 0;
    flex: 1 1 0;
    max-width: 72px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    background-image: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
    appearance: none;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    color: #111;
    touch-action: manipulation;
    cursor: pointer;
  }

  .goban-phone .besogo-control button:focus {
    outline: none;
  }

  .goban-phone .besogo-control button:focus-visible {
    outline: 2px solid #333;
    outline-offset: 2px;
  }

  .goban-phone .besogo-control button:active,
  .goban-phone .besogo-control button:hover {
    background: transparent;
    box-shadow: none;
  }

  .goban-phone .besogo-control button svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: block;
    pointer-events: none;
  }

  /* Hide jump-10 and sibling / style chrome from the primary row. */
  .goban-phone .besogo-control button:nth-child(2),
  .goban-phone .besogo-control button:nth-child(6),
  .goban-phone .besogo-control button:nth-child(n+8):not(#goban-mode-toggle):not(#goban-more-toggle) {
    display: none;
  }

  /* More keeps Raise / Lower / Cut only — tools live in the Mode menu (#23). */
  .goban-phone #goban-drawer .besogo-tool button,
  .goban-phone #goban-drawer .besogo-tool input[type="text"],
  .goban-phone #goban-drawer .besogo-tool input[value="Pass"] {
    display: none;
  }

  #goban-mode-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0, 0, 0, 0.25);
  }

  body.goban-mode-open #goban-mode-backdrop {
    display: block;
  }

  #goban-mode-menu {
    display: none;
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    z-index: 41;
    max-height: min(50vh, 380px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    padding: 8px 8px 4px;
  }

  body.goban-mode-open #goban-mode-menu {
    display: block;
  }

  .goban-mode-group + .goban-mode-group {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 2px solid #4a90c2;
  }

  .goban-mode-group-title {
    font: 600 11px/1.2 system-ui, sans-serif;
    color: #4a90c2;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 4px 6px;
  }

  .goban-mode-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .goban-mode-row button {
    min-width: 44px;
    min-height: 44px;
    width: 48px;
    height: 48px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 2px solid transparent;
    border-radius: 6px;
    box-shadow: none;
    appearance: none;
    -webkit-appearance: none;
    touch-action: manipulation;
  }

  .goban-mode-row button.is-selected {
    border-color: #333;
  }

  .goban-mode-row button svg {
    width: 32px;
    height: 32px;
    pointer-events: none;
  }

  .goban-mode-cancel {
    display: block;
    margin: 8px 4px 4px auto;
    padding: 8px 12px;
    background: none;
    border: none;
    font: 600 14px/1 system-ui, sans-serif;
    color: #333;
    touch-action: manipulation;
  }

  #goban-more-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0, 0, 0, 0.25);
  }

  body.goban-more-menu-open #goban-more-backdrop {
    display: block;
  }

  #goban-more-menu {
    display: none;
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    z-index: 41;
    max-height: min(50vh, 380px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    padding: 4px 0;
  }

  body.goban-more-menu-open #goban-more-menu {
    display: block;
  }

  .goban-more-item {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 12px 16px;
    margin: 0;
    background: none;
    border: none;
    border-bottom: 1px solid #eceae4;
    font: 400 16px/1.2 system-ui, sans-serif;
    color: #111;
    text-align: left;
    touch-action: manipulation;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .goban-more-item:last-of-type {
    border-bottom: none;
  }

  .goban-more-cancel {
    display: block;
    margin: 4px 8px 8px auto;
    padding: 8px 12px;
    background: none;
    border: none;
    font: 600 14px/1 system-ui, sans-serif;
    color: #333;
    touch-action: manipulation;
  }

  #goban-full-ui {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    z-index: 35;
    flex-direction: column;
    background: #f4f2ec;
    box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.18);
  }

  body.goban-full-ui-open #goban-full-ui {
    display: flex;
  }

  #goban-full-ui-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
    padding: 8px;
    background: #eceae4;
    border-bottom: 1px solid #c8c4bc;
  }

  #goban-full-ui-done {
    min-height: 44px;
    min-width: 44px;
    padding: 8px 16px;
    background: none;
    border: none;
    font: 600 14px/1 system-ui, sans-serif;
    color: #111;
    touch-action: manipulation;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  #goban-drawer {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px;
  }

  #goban-drawer > * {
    margin-bottom: 8px;
  }

  /* Landscape: compact chrome + menus; Full UI leaves the nav row visible. */
  @media (orientation: landscape) and (min-height: 320px) {
    .goban-phone .besogo-control {
      flex-wrap: wrap;
      justify-content: center;
    }

    .goban-phone .besogo-control button {
      max-width: 64px;
    }
  }
</style>
<script src="../vendor/besogo/js/besogo.js"></script>
<script src="../src/tetherMath.js"></script>
<script src="../src/modeMenu.js"></script>
<script src="../vendor/besogo/js/editor.js"></script>
<script src="../vendor/besogo/js/gameRoot.js"></script>
<script src="../vendor/besogo/js/svgUtil.js"></script>
<script src="../vendor/besogo/js/parseSgf.js"></script>
<script src="../vendor/besogo/js/loadSgf.js"></script>
<script src="../vendor/besogo/js/saveSgf.js"></script>
<script src="../src/fileActions.js"></script>
<script src="../src/moreMenu.js"></script>
<script src="../vendor/besogo/js/boardDisplay.js"></script>
<script src="../vendor/besogo/js/coord.js"></script>
<script src="../vendor/besogo/js/toolPanel.js"></script>
<script src="../vendor/besogo/js/filePanel.js"></script>
<script src="../vendor/besogo/js/controlPanel.js"></script>
<script src="../vendor/besogo/js/namesPanel.js"></script>
<script src="../vendor/besogo/js/commentPanel.js"></script>
<script src="../vendor/besogo/js/treePanel.js"></script>
</head>
<body class="goban-phone">
<div id="target" class="besogo-editor"></div>
<script>
(function () {
  var options = {
    resize: "fill",
    size: "19",
    coord: "western",
    panels: "control+names+comment+tool+tree+file",
    minpanelsheight: 64,
    minpanelswidth: 220
  };
  var search = location.search.substring(1);
  if (search) {
    search.split("&").forEach(function (pair) {
      var parts = pair.split("=");
      var name = parts.shift();
      if (name) options[name] = decodeURIComponent(parts.join("="));
    });
  }

  var container = document.getElementById("target");
  besogo.create(container, options);
  setupPhoneChrome(container);
  setupMoreMenu(container);
  setupModePicker(container);

  function makeMoreIcon() {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 100 100");
    svg.setAttribute("aria-hidden", "true");
    [22, 50, 78].forEach(function (cy) {
      var dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", "50");
      dot.setAttribute("cy", String(cy));
      dot.setAttribute("r", "8");
      dot.setAttribute("fill", "black");
      svg.appendChild(dot);
    });
    return svg;
  }

  function compactPhoneLayout(root) {
    var panels = root.querySelector(".besogo-panels");
    var board = root.querySelector(".besogo-board");
    var control = panels && panels.querySelector(".besogo-control");
    if (!panels || !board || !control) return;

    var w = root.clientWidth;
    var h = root.clientHeight;

    var navH = control.offsetHeight || 64;
    var boardSize = Math.min(w, h - navH);

    board.style.width = w + "px";
    board.style.height = boardSize + "px";
    panels.style.height = navH + "px";
    panels.style.width = w + "px";
  }

  function setupPhoneChrome(root) {
    var panels = root.querySelector(".besogo-panels");
    if (!panels) return;

    var drawer = document.createElement("div");
    drawer.id = "goban-drawer";
    drawer.setAttribute("aria-hidden", "true");

    ["names", "comment", "tool", "tree", "file"].forEach(function (name) {
      var panel = panels.querySelector(".besogo-" + name);
      if (panel) drawer.appendChild(panel);
    });

    var fullUi = document.createElement("div");
    fullUi.id = "goban-full-ui";
    fullUi.setAttribute("aria-hidden", "true");

    var doneBar = document.createElement("div");
    doneBar.id = "goban-full-ui-bar";
    var doneBtn = document.createElement("button");
    doneBtn.id = "goban-full-ui-done";
    doneBtn.type = "button";
    doneBtn.textContent = "Done";
    doneBar.appendChild(doneBtn);
    fullUi.appendChild(doneBar);
    fullUi.appendChild(drawer);
    document.body.appendChild(fullUi);

    doneBtn.addEventListener("click", function () {
      closeFullUi();
    });

    window.addEventListener("resize", function () {
      requestAnimationFrame(function () {
        compactPhoneLayout(root);
      });
    });
    compactPhoneLayout(root);
  }

  function closeFullUi() {
    if (!document.body.classList.contains("goban-full-ui-open")) return;
    document.body.classList.remove("goban-full-ui-open");
    var fullUi = document.getElementById("goban-full-ui");
    var moreBtn = document.getElementById("goban-more-toggle");
    if (fullUi) fullUi.setAttribute("aria-hidden", "true");
    if (moreBtn) {
      moreBtn.setAttribute("aria-expanded", "false");
      moreBtn.setAttribute("aria-label", "More");
    }
  }

  function closeMoreMenu() {
    document.body.classList.remove("goban-more-menu-open");
    var moreBtn = document.getElementById("goban-more-toggle");
    if (moreBtn) {
      moreBtn.setAttribute("aria-expanded", "false");
      moreBtn.setAttribute("aria-label", "More");
    }
  }

  function openFullUi() {
    closeMoreMenu();
    closeModeMenu();
    document.body.classList.add("goban-full-ui-open");
    var fullUi = document.getElementById("goban-full-ui");
    var moreBtn = document.getElementById("goban-more-toggle");
    if (fullUi) fullUi.setAttribute("aria-hidden", "false");
    if (moreBtn) {
      moreBtn.setAttribute("aria-expanded", "true");
      moreBtn.setAttribute("aria-label", "Hide extra panels");
    }
  }

  function setupMoreMenu(root) {
    var editor = root.besogoEditor;
    var panels = root.querySelector(".besogo-panels");
    var control = panels && panels.querySelector(".besogo-control");
    var moreBtn, backdrop, menu, fileInput, submenu = null;
    if (!editor || !control || !besogo.moreMenu || !besogo.fileActions) return;

    moreBtn = document.createElement("button");
    moreBtn.id = "goban-more-toggle";
    moreBtn.type = "button";
    moreBtn.setAttribute("aria-haspopup", "dialog");
    moreBtn.setAttribute("aria-expanded", "false");
    moreBtn.setAttribute("aria-controls", "goban-more-menu");
    moreBtn.setAttribute("aria-label", "More");
    moreBtn.title = "New, load, save, and full UI";
    moreBtn.appendChild(makeMoreIcon());
    control.appendChild(moreBtn);

    backdrop = document.createElement("div");
    backdrop.id = "goban-more-backdrop";
    document.body.appendChild(backdrop);

    menu = document.createElement("div");
    menu.id = "goban-more-menu";
    menu.setAttribute("role", "dialog");
    menu.setAttribute("aria-label", "More");
    document.body.appendChild(menu);

    fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);

    function bindFileInput(input) {
      input.addEventListener("change", function (evt) {
        var file = evt.target.files && evt.target.files[0];
        var replacement = document.createElement("input");
        replacement.type = "file";
        replacement.style.display = "none";
        input.parentNode.replaceChild(replacement, input);
        fileInput = replacement;
        bindFileInput(fileInput);

        if (!file) {
          closeMoreMenu();
          return;
        }

        var reader = new FileReader();
        reader.onload = function (e) {
          if (confirm("Load '" + file.name + "'?\n" + besogo.fileActions.WARNING)) {
            besogo.fileActions.setCurrentFileName(file.name);
            besogo.fileActions.loadSgfText(editor, e.target.result);
            closeMoreMenu();
          }
        };
        reader.readAsText(file);
      });
    }
    bindFileInput(fileInput);

    function renderMenu() {
      var list = submenu === "new" ? besogo.moreMenu.newSizes() : besogo.moreMenu.items();
      menu.replaceChildren();
      list.forEach(function (item) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "goban-more-item";
        btn.textContent = item.label;
        btn.setAttribute("aria-label", item.label);
        btn.addEventListener("click", function () {
          var result = besogo.moreMenu.applyChoice(editor, item, { confirm: confirm });
          if (result.triggerLoad) {
            fileInput.click();
            return;
          }
          if (result.showSubmenu !== undefined) {
            submenu = result.showSubmenu;
            renderMenu();
            return;
          }
          if (result.openFullUi) {
            openFullUi();
            return;
          }
          if (result.close) {
            submenu = null;
            closeMoreMenu();
          }
        });
        menu.appendChild(btn);
      });
      var cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "goban-more-cancel";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", function () {
        submenu = null;
        closeMoreMenu();
      });
      menu.appendChild(cancel);
    }

    function openMenu() {
      if (document.body.classList.contains("goban-full-ui-open")) {
        closeFullUi();
        return;
      }
      closeModeMenu();
      submenu = null;
      renderMenu();
      document.body.classList.add("goban-more-menu-open");
      moreBtn.setAttribute("aria-expanded", "true");
    }

    moreBtn.addEventListener("click", function () {
      if (document.body.classList.contains("goban-full-ui-open")) {
        closeFullUi();
      } else if (document.body.classList.contains("goban-more-menu-open")) {
        submenu = null;
        closeMoreMenu();
      } else {
        openMenu();
      }
    });
    backdrop.addEventListener("click", function () {
      submenu = null;
      closeMoreMenu();
    });
  }

  function makeToolSvg(tool) {
    var svg = besogo.svgEl("svg", {
      viewBox: "-55 -55 110 110",
      "aria-hidden": "true"
    });
    besogo.drawToolGlyph(svg, tool);
    return svg;
  }

  function closeModeMenu() {
    var modeBtn = document.getElementById("goban-mode-toggle");
    document.body.classList.remove("goban-mode-open");
    if (modeBtn) modeBtn.setAttribute("aria-expanded", "false");
  }

  function setupModePicker(root) {
    var editor = root.besogoEditor;
    var control = root.querySelector(".besogo-control");
    var moreBtn = document.getElementById("goban-more-toggle");
    var modeBtn, backdrop, menu, cancel;
    if (!editor || !control || !besogo.modeMenu) return;

    modeBtn = document.createElement("button");
    modeBtn.id = "goban-mode-toggle";
    modeBtn.type = "button";
    modeBtn.setAttribute("aria-haspopup", "dialog");
    modeBtn.setAttribute("aria-expanded", "false");
    modeBtn.setAttribute("aria-controls", "goban-mode-menu");
    modeBtn.setAttribute("aria-label", "Mode");
    modeBtn.title = "Play, markup, and edit tools";
    modeBtn.appendChild(makeToolSvg(editor.getTool()));
    if (moreBtn) control.insertBefore(modeBtn, moreBtn);
    else control.appendChild(modeBtn);

    backdrop = document.createElement("div");
    backdrop.id = "goban-mode-backdrop";
    document.body.appendChild(backdrop);

    menu = document.createElement("div");
    menu.id = "goban-mode-menu";
    menu.setAttribute("role", "dialog");
    menu.setAttribute("aria-label", "Choose mode");
    document.body.appendChild(menu);

    function refreshModeIcon() {
      modeBtn.replaceChildren(makeToolSvg(editor.getTool()));
    }

    function closeMore() {
      closeMoreMenu();
      closeFullUi();
    }

    function renderMenu() {
      menu.replaceChildren();
      besogo.modeMenu.groups().forEach(function (group) {
        var section = document.createElement("section");
        var title = document.createElement("h2");
        var row = document.createElement("div");
        section.className = "goban-mode-group";
        title.className = "goban-mode-group-title";
        title.textContent = group.title;
        row.className = "goban-mode-row";
        group.items.forEach(function (item) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.title = item.label;
          btn.setAttribute("aria-label", item.label);
          if (besogo.modeMenu.isSelected(editor, item)) {
            btn.className = "is-selected";
          }
          btn.appendChild(makeToolSvg(besogo.modeMenu.glyphTool(item)));
          btn.addEventListener("click", function () {
            besogo.modeMenu.applyChoice(editor, item);
            closeModeMenu();
          });
          row.appendChild(btn);
        });
        section.appendChild(title);
        section.appendChild(row);
        menu.appendChild(section);
      });
      cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "goban-mode-cancel";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", closeModeMenu);
      menu.appendChild(cancel);
    }

    function openMenu() {
      closeMore();
      renderMenu();
      document.body.classList.add("goban-mode-open");
      modeBtn.setAttribute("aria-expanded", "true");
    }

    modeBtn.addEventListener("click", function () {
      if (document.body.classList.contains("goban-mode-open")) closeModeMenu();
      else openMenu();
    });
    backdrop.addEventListener("click", closeModeMenu);
    editor.addListener(function (msg) {
      if (msg.tool) refreshModeIcon();
    });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
})();
</script>
</body>
</html>
