<head>

<body>
<div id="board"></div>
<script>
var el = document.getElementById("board");
besogo.create(el, { size: 19, panels: "control", tool: "auto", resize: "fill", coord: "western" });
el.besogoEditor.addListener(function (msg) {

});
</script>
