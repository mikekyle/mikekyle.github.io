  .title-row {

    border-radius: 999px;
    padding: 3px 8px;
    font-weight: 600;

  .controls {

    outline: none;

  .count {

    min-width: 4.5rem;

  main { max-width: 720px; margin: 0 auto; padding: 10px 10px 40px; }

const list = document.getElementById('list');
const search = document.getElementById('search');
const countEl = document.getElementById('count');
const empty = document.getElementById('empty');

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

function pounds(v) {
  if (v == null || v === '') return '—';
  return Number(v).toFixed(2);
}
function stars(v) {
  const n = Math.max(0, Math.min(5, Number(v) || 0));
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}
function condCompact(r) {
  if (r.condition_compact) return r.condition_compact;
  const m = r.media_code || shortGrade(r.media_condition);
  const s = r.sleeve_code || shortGrade(r.sleeve_condition);
  return `${m}/${s}`;
}
function shortGrade(cond) {
  if (!cond) return '—';
  const map = [
    ['Near Mint', 'NM'], ['Mint (M)', 'M'], ['Very Good Plus', 'VG+'],
    ['Very Good (VG)', 'VG'], ['Good Plus', 'G+'], ['Good (G)', 'G'],
    ['Fair', 'F'], ['Poor', 'P'], ['Generic', 'Gen'], ['No Cover', 'NC'],
    ['Not Graded', 'NG']
  ];
  for (const [a,b] of map) if (cond.includes(a) || cond === a) return b;
  return cond.slice(0, 4);
}
function shipsShort(r) {
  return r.ships_from_short || r.ships_from || '—';
}
function artHtml(r) {
  if (r.art_thumb) {
    return `<img class="art" src="${esc(r.art_thumb)}" alt="" loading="lazy" width="56" height="56" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'art-ph',textContent:'LP'}))">`;
  }
  return `<div class="art-ph" aria-hidden="true">LP</div>`;
}
function priceHtml(item, ship) {
  return `£${pounds(item)}<span class="ship">(+${pounds(ship)})</span>`;
}
function pressingLine(c) {
  const bits = [];
  if (c.release_year) bits.push(String(c.release_year));
  const note = c.pressing_note || (Array.isArray(c.format_names)
    ? c.format_names.filter(n => n && n !== 'Vinyl').slice(0, 3).join(' · ')
    : '');
  if (note) bits.push(note);
  if (c.sleeve_condition) bits.push(`sleeve ${shortGrade(c.sleeve_condition)}`);
  return bits.join(' · ');
}

function altRow(c, isPrimary) {
  const tag = isPrimary ? `<span class="tag">best</span>` : '';
  const url = c.listing_url || '#';
  return `<div class="alt">
    <div class="alt-main">
      <div class="alt-price">${tag}${priceHtml(c.item_price_gbp, c.shipping_gbp)}</div>
      <div class="alt-meta">${esc(condCompact(c))} · ${esc(shipsShort(c))} · ${esc(pressingLine(c) || 'vinyl')}</div>
      <div class="alt-meta">${esc(c.seller || '')}</div>
    </div>
    <div class="alt-actions">
      <div class="alt-total">£${pounds(c.total_gbp)} tot</div>
      <a class="btn btn-ghost" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open</a>
    </div>
  </div>`;
}

function detailHtml(r) {
  const cands = (r.candidates && r.candidates.length)
    ? r.candidates
    : [{
        listing_id: r.listing_id,
        release_id: r.matched_release_id || r.release_id,
        release_year: r.release_year,
        item_price_gbp: r.item_price_gbp,
        shipping_gbp: r.shipping_gbp,
        total_gbp: r.total_gbp,
        media_condition: r.media_condition,
        sleeve_condition: r.sleeve_condition,
        condition_compact: condCompact(r),
        ships_from: r.ships_from,
        ships_from_short: shipsShort(r),
        seller: r.seller,
        listing_url: r.listing_url,
        format_names: r.format_names,
        pressing_note: r.pressing_note,
      }];

  const fullCond = `Media ${esc(r.media_condition || '—')} · Sleeve ${esc(r.sleeve_condition || '—')}`;
  const alts = cands.map((c, i) => altRow(c, i === 0)).join('');
  const primaryUrl = cands[0].listing_url || r.listing_url || '#';

  return `<div class="detail">
    <div class="detail-block">
      <div class="detail-label">Condition</div>
      <div class="detail-text">${fullCond}</div>
    </div>
    <div class="detail-block">
      <div class="detail-label">Listings${cands.length > 1 ? ` · ${cands.length} options` : ''}</div>
      <div class="alts">${alts}</div>
    </div>
    <div class="detail-block" style="margin-top:4px">
      <a class="btn" href="${esc(primaryUrl)}" target="_blank" rel="noopener noreferrer">Open best on Discogs</a>
    </div>
  </div>`;
}

function cardHtml(r) {
  return `<details class="card" role="listitem" data-q="${esc([
      r.artist, r.album, r.media_condition, r.sleeve_condition,
      r.ships_from, r.ships_from_short, r.year, r.release_year,
      ...(r.format_names || []), r.seller || ''
    ].filter(Boolean).join(' ').toLowerCase())}">
    <summary class="card-summary">
      ${artHtml(r)}
      <div class="meta">
        <div class="title">${esc(r.artist)}<span class="sep">—</span>${esc(r.album)}</div>
        <div class="sub">
          <span class="stars" title="${esc(r.rating)}/5">${stars(r.rating)}</span>
          <span class="cond">${esc(condCompact(r))}</span>
          <span class="ships">${esc(shipsShort(r))}</span>
        </div>
      </div>
      <div class="price-col">
        <div class="price-main">${priceHtml(r.item_price_gbp, r.shipping_gbp)}<span class="chev" aria-hidden="true"></span></div>
        <div class="price-total">£${pounds(r.total_gbp)}</div>
      </div>
    </summary>
    ${detailHtml(r)}
  </details>`;
}

function render() {
  const q = search.value.trim().toLowerCase();
  const filtered = records.filter(r => {
    if (!q) return true;
    const hay = [
      r.artist, r.album, r.media_condition, r.sleeve_condition,
      r.ships_from, r.ships_from_short, r.year, r.release_year,
      r.seller, ...(r.format_names || [])
    ].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  list.innerHTML = filtered.map(cardHtml).join('');
  countEl.textContent = `${filtered.length}/${records.length}`;
  empty.hidden = filtered.length !== 0;
}

search.addEventListener('input', render);
render();
</script>
</body>
</html>
